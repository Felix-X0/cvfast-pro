<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor — CVFast Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="editor-page">

<nav class="editor-nav">
    <div class="logo"><strong>CV</strong>Fast Pro</div>
    <div class="nav-actions">
        <button id="saveBtn" class="btn-secondary">💾 Simpan</button>
        <button id="exportPdfBtn" class="btn-primary">⬇ Export PDF</button>
    </div>
</nav>

<div class="editor-container">

    <!-- ===== PANEL KIRI ===== -->
    <aside class="form-section">

        <!-- Desain -->
        <div class="control-panel">
            <div class="form-group-title" style="margin-bottom:12px;">
                <span>🎨</span> Pengaturan Desain
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Layout</label>
                    <select id="layoutSelect">
                        <option value="layout-sidebar">Modern (Sidebar)</option>
                        <option value="layout-header">Kreatif (Header)</option>
                        <option value="layout-minimalist">Klasik (Minimalis)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Warna</label>
                    <select id="themeSelect">
                        <option value="theme-blue">🔵 Biru</option>
                        <option value="theme-dark">⚫ Hitam</option>
                        <option value="theme-emerald">🟢 Hijau</option>
                        <option value="theme-red">🔴 Merah</option>
                        <option value="theme-purple">🟣 Ungu</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Pribadi -->
        <div class="form-group">
            <div class="form-group-title"><span>👤</span> Data Pribadi</div>

            <!-- Photo upload area -->
            <input type="file" id="photoInput" accept="image/*" style="display:none">
            <div class="photo-preview-box" id="photoBox" onclick="document.getElementById('photoInput').click()">
                <div class="preview-circle" id="previewCircle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="preview-text">
                    <p id="photoLabel">Upload foto profil</p>
                    <span>JPG, PNG — Klik untuk pilih</span>
                </div>
                <button class="clear-btn" id="clearPhotoBtn" style="display:none" onclick="event.stopPropagation();clearPhoto()">Hapus</button>
            </div>

            <div class="input-group"><label>Nama Lengkap</label><input type="text" id="nameInput" placeholder="Budi Santoso"></div>
            <div class="input-group"><label>Profesi / Posisi Target</label><input type="text" id="titleInput" placeholder="Software Engineer"></div>
            <div class="input-row">
                <div class="input-group"><label>Email</label><input type="email" id="emailInput" placeholder="budi@email.com"></div>
                <div class="input-group"><label>No. HP</label><input type="text" id="phoneInput" placeholder="0812-xxxx-xxxx"></div>
            </div>
            <div class="input-group"><label>Kota / Alamat</label><input type="text" id="addressInput" placeholder="Jakarta, Indonesia"></div>
            <div class="input-group"><label>LinkedIn / Portfolio</label><input type="text" id="linkInput" placeholder="linkedin.com/in/budi"></div>
            <div class="input-group"><label>Tentang Saya</label><textarea id="aboutInput" rows="3" placeholder="Profesional berpengalaman dengan dedikasi tinggi..."></textarea></div>
        </div>

        <!-- Pengalaman -->
        <div class="form-group">
            <div class="form-group-title"><span>💼</span> Pengalaman Kerja</div>
            <div class="input-group"><label>Posisi / Jabatan</label><input type="text" id="expPos" placeholder="Manajer Pemasaran"></div>
            <div class="input-group"><label>Perusahaan</label><input type="text" id="expCompany" placeholder="PT Maju Jaya"></div>
            <div class="input-group"><label>Periode</label><input type="text" id="expDate" placeholder="2020 – Sekarang"></div>
            <div class="input-group"><label>Deskripsi</label><textarea id="expDesc" rows="3" placeholder="Memimpin tim marketing beranggotakan 10 orang..."></textarea></div>
        </div>

        <!-- Pendidikan -->
        <div class="form-group">
            <div class="form-group-title"><span>🎓</span> Pendidikan</div>
            <div class="input-group"><label>Gelar / Jurusan</label><input type="text" id="eduDegree" placeholder="S1 Ilmu Komputer"></div>
            <div class="input-group"><label>Universitas / Sekolah</label><input type="text" id="eduSchool" placeholder="Universitas Indonesia"></div>
            <div class="input-group"><label>Tahun</label><input type="text" id="eduDate" placeholder="2015 – 2019"></div>
        </div>

        <!-- Keahlian -->
        <div class="form-group">
            <div class="form-group-title"><span>⚡</span> Keahlian</div>
            <div class="input-group">
                <label>Pisahkan dengan koma</label>
                <textarea id="skillsInput" rows="3" placeholder="Leadership, Microsoft Office, Komunikasi, Analisis Data"></textarea>
            </div>
        </div>

        <!-- Support -->
        <div class="support-box">
            <p>✨ Terima kasih sudah pakai CVFast Pro!</p>
            <div class="links">
                <a href="https://sociabuzz.com/cadis77/tribe" target="_blank" class="btn-donate">☕ Sawer</a>
                <a href="https://www.instagram.com/cadis_1w" target="_blank" class="btn-ig">
                    <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    Instagram
                </a>
            </div>
        </div>

    </aside>

    <!-- ===== PANEL KANAN: PREVIEW CV ===== -->
    <main class="preview-section">
        <div class="a4-paper layout-sidebar theme-blue" id="cvPreview">
            <!-- Dirender ulang oleh JS -->
        </div>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
