<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CV Builder</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

.form{
width:40%;
background:white;
padding:20px;
border-radius:15px;
}

.preview{
width:60%;
background:white;
padding:30px;
border-radius:15px;
}

input,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
}

button{
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
width:100%;
}

#photoPreview{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.form,.preview{
width:100%;
}

}

</style>

</head>
<body>

<div class="container">

<div class="form">

<h2>Create CV</h2>

<input id="name" placeholder="Full Name">

<input id="job" placeholder="Job Title">

<input id="email" placeholder="Email">

<textarea id="summary"
placeholder="Professional Summary"></textarea>

<textarea id="education"
placeholder="Education"></textarea>

<textarea id="experience"
placeholder="Experience"></textarea>

<textarea id="skills"
placeholder="Skills"></textarea>

<input type="file" id="photo">

<button onclick="updateCV()">
Update CV
</button>

</div>

<div class="preview">

<img id="photoPreview"
src="https://via.placeholder.com/120">

<h1 id="cvName">Your Name</h1>

<h3 id="cvJob">Job Title</h3>

<p id="cvEmail">Email</p>

<hr><br>

<h3>Summary</h3>
<p id="cvSummary"></p>

<br>

<h3>Education</h3>
<p id="cvEducation"></p>

<br>

<h3>Experience</h3>
<p id="cvExperience"></p>

<br>

<h3>Skills</h3>
<p id="cvSkills"></p>

</div>

</div>

<script>

function updateCV(){

cvName.innerText=name.value;
cvJob.innerText=job.value;
cvEmail.innerText=email.value;

cvSummary.innerText=summary.value;
cvEducation.innerText=education.value;
cvExperience.innerText=experience.value;
cvSkills.innerText=skills.value;

}

photo.addEventListener("change",(e)=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=(event)=>{

photoPreview.src=event.target.result;

}

reader.readAsDataURL(file);

});

</script>

</body>
</html>
