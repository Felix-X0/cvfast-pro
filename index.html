<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVFast Pro - Pembuat CV Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-2 rounded font-bold text-xl">CV</div>
                <span class="font-bold text-xl tracking-tight">Fast <span class="text-blue-600">Pro</span></span>
            </div>
            <button onclick="document.getElementById('app-section').scrollIntoView({behavior: 'smooth'})" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-full transition">Mulai Buat</button>
        </div>
    </nav>

    <section id="app-section" class="container mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3 bg-white p-6 rounded-xl shadow-lg h-fit">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold border-b-2 border-blue-600 pb-2 inline-block">Data CV</h2>
                <button id="btn-clear" class="text-sm text-red-500 hover:underline">Hapus Data</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Gaya Desain</label>
                    <select id="template-select" class="w-full border rounded p-2 focus:ring focus:ring-blue-200 font-medium">
                        <option value="layout-left-dark">Gaya 1: Sidebar Kiri Gelap (Modern Biru)</option>
                        <option value="layout-right-dark">Gaya 2: Sidebar Kanan Gelap (Elegan Hitam)</option>
                        <option value="layout-left-light">Gaya 3: Sidebar Kiri Terang (Minimalis Bersih)</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Foto Profil</label>
                    <input type="file" id="input-photo" accept="image/*" class="w-full border rounded p-2 text-sm">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Nama Lengkap</label>
                    <input type="text" id="input-name" class="w-full border rounded p-2 form-input" placeholder="Nama Anda">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Posisi / Jabatan</label>
                    <input type="text" id="input-title" class="w-full border rounded p-2 form-input" placeholder="Graphic Designer">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Email</label>
                        <input type="email" id="input-email" class="w-full border rounded p-2 form-input" placeholder="email@anda.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Telepon</label>
                        <input type="text" id="input-phone" class="w-full border rounded p-2 form-input" placeholder="08123456789">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Profil / Tentang Saya</label>
                    <textarea id="input-summary" rows="3" class="w-full border rounded p-2 form-input" placeholder="Deskripsi singkat profil Anda..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Pengalaman Kerja</label>
                    <textarea id="input-experience" rows="4" class="w-full border rounded p-2 form-input" placeholder="2020 - 2024 | Perusahaan A | Posisi&#10;Deskripsi singkat pekerjaan."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Pendidikan</label>
                    <textarea id="input-education" rows="3" class="w-full border rounded p-2 form-input" placeholder="2016 - 2020 | Universitas B | Jurusan"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Keahlian (Pisahkan koma)</label>
                    <input type="text" id="input-skills" class="w-full border rounded p-2 form-input" placeholder="UI/UX Design, Typography, Branding">
                </div>
            </div>
            
            <button id="btn-download" class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded shadow-lg flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </button>
        </div>

        <div class="w-full lg:w-2/3 flex justify-center bg-gray-200 p-4 rounded-xl overflow-x-auto overflow-y-hidden">
            <div id="cv-preview-container" class="bg-white shadow-2xl cv-a4 cv-layout-left-dark">
                
                <div class="cv-sidebar p-8 flex flex-col">
                    <div class="cv-photo-container mb-8 mx-auto flex items-center justify-center overflow-hidden bg-white">
                        <img id="preview-photo" src="" alt="Profil" class="w-full h-full object-cover hidden">
                        <i id="photo-placeholder" class="fa-solid fa-user text-5xl text-gray-300"></i>
                    </div>

                    <div class="mb-8">
                        <h3 class="cv-side-heading font-bold uppercase tracking-widest mb-4">Kontak</h3>
                        <div class="space-y-3 text-sm">
                            <p class="flex items-center gap-3"><span class="cv-icon-box"><i class="fa-solid fa-envelope"></i></span> <span id="preview-email" class="break-all">email@anda.com</span></p>
                            <p class="flex items-center gap-3"><span class="cv-icon-box"><i class="fa-solid fa-phone"></i></span> <span id="preview-phone">08123456789</span></p>
                        </div>
                    </div>

                    <div>
                        <h3 class="cv-side-heading font-bold uppercase tracking-widest mb-4">Keahlian</h3>
                        <div id="preview-skills" class="flex flex-wrap gap-2 text-sm">
                            <span class="cv-skill-badge">Keahlian 1</span>
                        </div>
                    </div>
                </div>

                <div class="cv-main p-10 flex flex-col justify-center">
                    <div class="cv-header-area border-b-4 cv-main-border pb-6 mb-8">
                        <h1 id="preview-name" class="text-5xl font-extrabold uppercase leading-none mb-2 tracking-wide">NAMA ANDA</h1>
                        <h2 id="preview-title" class="text-2xl font-light tracking-widest uppercase">Posisi Pekerjaan</h2>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-bold uppercase cv-main-heading mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-user"></i> Profil
                        </h3>
                        <p id="preview-summary" class="text-sm leading-relaxed whitespace-pre-line text-justify">Ringkasan profesional Anda.</p>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-bold uppercase cv-main-heading mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-briefcase"></i> Pengalaman
                        </h3>
                        <div id="preview-experience" class="text-sm leading-relaxed whitespace-pre-line pl-4 cv-timeline">
                            Daftar pengalaman kerja.
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xl font-bold uppercase cv-main-heading mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-graduation-cap"></i> Pendidikan
                        </h3>
                        <div id="preview-education" class="text-sm leading-relaxed whitespace-pre-line pl-4 cv-timeline">
                            Riwayat pendidikan.
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
