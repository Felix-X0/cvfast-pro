<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CV Studio Pro - Pro Layouts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 p-8">

    <div class="max-w-4xl mx-auto mb-8 flex gap-4">
        <button onclick="changeLayout('modern')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Layout Modern (Grid)</button>
        <button onclick="changeLayout('classic')" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-bold">Layout Klasik (Sidebar)</button>
        <button onclick="changeLayout('minimal')" class="bg-orange-600 text-white px-4 py-2 rounded text-sm font-bold">Layout Minimal (Clean)</button>
    </div>

    <div id="cv-canvas" class="bg-white mx-auto w-[210mm] min-h-[297mm] shadow-2xl p-0 overflow-hidden transition-all duration-500">
        <div id="cv-content" class="p-16">
            </div>
    </div>

    <script>
        const content = document.getElementById('cv-content');

        function changeLayout(type) {
            if (type === 'modern') {
                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-10">
                        <div class="col-span-2 text-center border-b pb-8"><h1 class="text-6xl font-black">NAMA ANDA</h1></div>
                        <div class="bg-zinc-100 p-6 rounded-lg"><h2 class="font-bold mb-4 text-blue-600">PENGALAMAN</h2><p>Data pengalaman...</p></div>
                        <div class="bg-zinc-100 p-6 rounded-lg"><h2 class="font-bold mb-4 text-blue-600">PENDIDIKAN</h2><p>Data pendidikan...</p></div>
                    </div>`;
            } else if (type === 'classic') {
                content.innerHTML = `
                    <div class="flex">
                        <div class="w-1/3 bg-slate-900 text-white p-10 min-h-[297mm]">
                            <h1 class="text-3xl font-bold">NAMA</h1>
                            <div class="mt-10">Kontak...</div>
                        </div>
                        <div class="w-2/3 p-10">
                            <h2 class="text-2xl font-bold border-b mb-4">Profil Profesional</h2>
                            <p>Deskripsi diri...</p>
                        </div>
                    </div>`;
            } else if (type === 'minimal') {
                content.innerHTML = `
                    <div class="text-left max-w-2xl mx-auto">
                        <h1 class="text-5xl font-light tracking-tighter mb-10">NAMA ANDA</h1>
                        <div class="space-y-10">
                            <section><h3>Tentang Saya</h3><p>Deskripsi minimal...</p></section>
                            <section><h3>Pengalaman</h3><p>Daftar pengalaman...</p></section>
                        </div>
                    </div>`;
            }
        }
        // Load default
        changeLayout('modern');
    </script>
</body>
</html>
