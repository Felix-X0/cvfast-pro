<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CVPro Elite | Professional Design Studio</title>
    <!-- Core Engine: Fabric.js for Professional Drag-and-Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; font-family: 'Inter', sans-serif; overflow: hidden; }
        .canvas-wrapper { box-shadow: 0 0 50px rgba(0,0,0,0.8); border: 1px solid #334155; }
        .template-card:hover { border-color: #3b82f6; transform: scale(1.02); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Navbar -->
    <header class="h-16 border-b border-white/10 flex items-center px-6 justify-between bg-slate-900 z-50">
        <h1 class="font-black text-xl text-white tracking-tighter">CVPRO <span class="text-blue-500">STUDIO</span></h1>
        <div class="flex gap-3">
            <button onclick="addText()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-xs font-bold">+ Teks</button>
            <button onclick="addImage()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-xs font-bold">+ Foto</button>
            <button onclick="exportCanvas()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold">Export PDF/PNG</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar Templates -->
        <aside class="w-72 bg-slate-900 p-4 border-r border-white/10 overflow-y-auto">
            <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Library 100+ Desain</h2>
            <div id="template-list" class="grid grid-cols-2 gap-3">
                <!-- Templates generated by JS -->
            </div>
        </aside>

        <!-- Canvas -->
        <main class="flex-1 flex items-center justify-center p-10 overflow-auto bg-slate-950">
            <div class="canvas-wrapper">
                <canvas id="cv-canvas" width="600" height="850"></canvas>
            </div>
        </main>
    </div>

    <script>
        const canvas = new fabric.Canvas('cv-canvas', { backgroundColor: '#ffffff' });

        // Data 100+ Desain (Generatif)
        const themes = [
            { name: "Modern", color: "#1e293b" },
            { name: "Bold", color: "#be123c" },
            { name: "Eco", color: "#059669" },
            { name: "Tech", color: "#2563eb" },
            { name: "Luxury", color: "#78350f" },
            { name: "Royal", color: "#6d28d9" },
            { name: "Ocean", color: "#0369a1" }
        ];

        // Generate sidebar items
        const list = document.getElementById('template-list');
        for(let i=0; i<100; i++) {
            let t = themes[i % themes.length];
            list.innerHTML += `
                <div onclick="loadTemplate('${t.color}')" 
                     class="template-card h-20 bg-slate-800 rounded cursor-pointer border border-slate-700 transition flex items-center justify-center text-[9px] font-bold text-slate-300">
                     ${t.name} ${i+1}
                </div>`;
        }

        function loadTemplate(color) {
            canvas.clear();
            canvas.backgroundColor = '#ffffff';
            const rect = new fabric.Rect({ left: 0, top: 0, width: 180, height: 850, fill: color });
            const title = new fabric.IText('NAMA ANDA', { left: 200, top: 50, fontSize: 35, fontWeight: 'bold', fontFamily: 'Arial' });
            canvas.add(rect, title);
        }

        function addText() {
            const text = new fabric.IText('Klik untuk ubah', { left: 200, top: 200, fontSize: 20 });
            canvas.add(text);
        }

        function addImage() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = function(event){
                    const imgObj = new Image();
                    imgObj.src = event.target.result;
                    imgObj.onload = function () {
                        const image = new fabric.Image(imgObj);
                        image.scaleToWidth(150);
                        canvas.add(image);
                    }
                }
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function exportCanvas() {
            const link = document.createElement('a');
            link.download = 'cv-pro-design.png';
            link.href = canvas.toDataURL({ format: 'png', quality: 1.0 });
            link.click();
        }

        loadTemplate('#1e293b');
    </script>
</body>
</html>
