<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CVStudio Pro - Canva Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent-color: #064e3b; --bg-sidebar: #064e3b; }
        .cv-a4 { width: 210mm; min-height: 297mm; background: white; display: table; margin: auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .cv-sidebar { width: 35%; display: table-cell; vertical-align: top; background: var(--bg-sidebar); color: white; padding: 40px; }
        .cv-main { width: 65%; display: table-cell; vertical-align: top; padding: 40px; }
        .cv-photo-container { width: 150px; height: 150px; background: #eee; margin: auto; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        /* Tema Warna */
        .theme-emerald { --accent-color: #064e3b; --bg-sidebar: #064e3b; }
        .theme-navy { --accent-color: #1e3a8a; --bg-sidebar: #1e3a8a; }
        .theme-earth { --accent-color: #78350f; --bg-sidebar: #78350f; }
        
        /* Font & Shape */
        .font-classic { font-family: 'Playfair Display', serif; }
        .shape-circle { border-radius: 50% !important; }
        .shape-tall { border-radius: 20px !important; height: 220px !important; width: 140px !important; }
        
        .cv-skill-badge { background: var(--accent-color); color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; display: inline-block; margin: 2px; }
    </style>
</head>
<body class="bg-zinc-100 h-screen flex flex-col">
    <header class="h-14 bg-white border-b flex items-center justify-between px-6">
        <h1 class="font-bold text-xl">CVStudio Pro</h1>
        <button id="btn-download" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm">Unduh PDF</button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 bg-zinc-900 text-zinc-300 p-6 overflow-y-auto">
            <div class="space-y-6">
                <div>
                    <label class="text-xs font-bold uppercase text-zinc-500">Pilih Tema & Gaya</label>
                    <select id="theme-color-select" class="w-full mt-2 bg-zinc-800 p-2 text-sm rounded">
                        <option value="theme-emerald">Emerald Sophisticate</option>
                        <option value="theme-navy">Midnight Navy</option>
                        <option value="theme-earth">Earth Tone</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-zinc-500">Font & Bentuk Foto</label>
                    <select id="font-select" class="w-full mt-2 bg-zinc-800 p-2 text-sm rounded mb-2">
                        <option value="font-modern">Modern</option>
                        <option value="font-classic">Klasik</option>
                    </select>
                    <select id="shape-select" class="w-full bg-zinc-800 p-2 text-sm rounded">
                        <option value="shape-circle">Bulat</option>
                        <option value="shape-tall">Memanjang</option>
                    </select>
                </div>
                <hr class="border-zinc-700">
                <input type="text" id="input-name" class="w-full bg-zinc-800 p-2 rounded text-white" placeholder="Nama Lengkap">
                <textarea id="input-summary" class="w-full bg-zinc-800 p-2 rounded text-white" placeholder="Profil Singkat"></textarea>
                <input type="file" id="input-photo" class="text-xs">
            </div>
        </aside>

        <main class="flex-1 overflow-auto p-12 theme-emerald" id="cv-container">
            <div id="cv-preview-container" class="cv-a4">
                <div class="cv-sidebar">
                    <div id="photo-box" class="cv-photo-container shape-circle"><i class="fa fa-user"></i></div>
                    <h2 class="mt-8 font-bold">KONTAK</h2>
                    <p id="preview-email" class="text-xs mt-2">email@anda.com</p>
                </div>
                <div class="cv-main">
                    <h1 id="preview-name" class="text-4xl font-bold uppercase">NAMA ANDA</h1>
                    <p id="preview-summary" class="mt-4 text-zinc-600">Deskripsi profesional anda akan muncul di sini.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Logika Sinkronisasi
        document.getElementById('input-name').addEventListener('input', (e) => document.getElementById('preview-name').innerText = e.target.value);
        document.getElementById('input-summary').addEventListener('input', (e) => document.getElementById('preview-summary').innerText = e.target.value);
        
        // Ganti Tema
        document.getElementById('theme-color-select').addEventListener('change', (e) => {
            const container = document.getElementById('cv-container');
            container.className = `flex-1 overflow-auto p-12 ${e.target.value}`;
        });

        // Ganti Font
        document.getElementById('font-select').addEventListener('change', (e) => {
            document.getElementById('cv-preview-container').className = `cv-a4 ${e.target.value}`;
        });

        // Ganti Bentuk Foto
        document.getElementById('shape-select').addEventListener('change', (e) => {
            const photo = document.getElementById('photo-box');
            photo.className = `cv-photo-container ${e.target.value}`;
        });

        // Download PDF
        document.getElementById('btn-download').addEventListener('click', () => {
            html2pdf().from(document.getElementById('cv-preview-container')).save('CV_Saya.pdf');
        });
    </script>
</body>
</html>
